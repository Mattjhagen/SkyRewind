<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyRewind - Aircraft Tracking & Sighting Reports</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header>
        <h1>SkyRewind</h1>
        <nav>
            <button class="nav-btn active" data-view="live">Live View</button>
            <button class="nav-btn" data-view="report">Report Sighting</button>
            <button class="nav-btn" data-view="rewind">Rewind</button>
        </nav>
    </header>

    <main>
        <!-- Live View -->
        <section id="live-view" class="view active">
            <h2>Live Aircraft Traffic</h2>
            <div id="live-map" class="map"></div>
            <div class="stats">
                <span id="live-count">0 aircraft tracked</span>
                <span id="live-last-update">Last update: never</span>
            </div>
        </section>

        <!-- Report Sighting -->
        <section id="report-view" class="view">
            <h2>Report a Sighting</h2>
            <form id="sighting-form">
                <div class="form-row">
                    <label>
                        Your Name *
                        <input type="text" name="reporter_name" required>
                    </label>
                    <label>
                        Date & Time (Local) *
                        <input type="datetime-local" name="sighting_time" required>
                    </label>
                </div>

                <div class="form-row">
                    <label>
                        Location * <small>(Click map to set, or enter coordinates)</small>
                        <input type="text" name="location_text" placeholder="Describe location (optional)">
                    </label>
                </div>

                <div id="report-map" class="map"></div>

                <div class="form-row">
                    <label>
                        Latitude *
                        <input type="number" name="lat" step="any" required readonly>
                    </label>
                    <label>
                        Longitude *
                        <input type="number" name="lon" step="any" required readonly>
                    </label>
                </div>

                <div class="form-row">
                    <label>
                        Compass Bearing (degrees)
                        <input type="number" name="bearing" min="0" max="359" placeholder="Direction you were looking">
                    </label>
                    <label>
                        Elevation Angle (degrees)
                        <input type="number" name="elevation" min="0" max="90" placeholder="Angle above horizon">
                    </label>
                </div>

                <div class="form-row">
                    <label>
                        Description *
                        <textarea name="description" rows="4" required placeholder="Describe what you saw"></textarea>
                    </label>
                </div>

                <div class="form-row">
                    <label>
                        Duration
                        <input type="text" name="duration" placeholder="How long did you observe it?">
                    </label>
                    <label>
                        Photo (optional)
                        <input type="file" name="photo" accept="image/*">
                    </label>
                </div>

                <button type="submit" class="btn-primary">Submit Report</button>
            </form>
        </section>

        <!-- Rewind View -->
        <section id="rewind-view" class="view">
            <h2>Rewind & Match</h2>

            <div class="controls">
                <div class="control-group">
                    <label>
                        Select Sighting:
                        <select id="sighting-select">
                            <option value="">-- Choose a sighting --</option>
                        </select>
                    </label>
                    <button id="load-sighting-btn" class="btn-secondary">Load</button>
                </div>

                <div class="control-group">
                    <label>
                        Time:
                        <input type="datetime-local" id="rewind-time">
                    </label>
                    <label>
                        Search Radius (miles):
                        <input type="number" id="search-radius" value="25" min="1" max="100" step="1">
                    </label>
                </div>

                <div class="time-slider-container">
                    <label>Time Window (±10 min):</label>
                    <input type="range" id="time-slider" min="-10" max="10" value="0" step="0.5">
                    <span id="time-offset">±0 min</span>
                </div>
            </div>

            <div id="rewind-map" class="map"></div>

            <div id="match-results">
                <h3>Aircraft Matches</h3>
                <div id="match-list"></div>
            </div>
        </section>
    </main>

    <footer>
        Data: ADS-B via dump1090 • <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
    </footer>

    <div id="notification" class="notification"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
